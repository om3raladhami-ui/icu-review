<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ICU Review">
<meta name="theme-color" content="#1F3864">
<link rel="icon" href="icon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Critical Care Pharmacotherapy Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --sunk:#EDF1F7;
  --line:#D5DCE8; --line-soft:#E6EBF3;
  --ink:#16202F; --ink-mid:#53617A; --ink-dim:#8794AB;
  --navy:#1F3864; --navy-soft:#E8EDF7;
  --red:#B3121B; --red-soft:#FBEAEB;
  --amber:#9C6500; --amber-soft:#FDF2DE;
  --green:#1E6B3A; --green-soft:#E6F3EA;
  --lbl:#EDF0F6; --rule:#AFB6C6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
html{color-scheme:only light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:92px}
.wrap{max-width:580px;margin:0 auto;padding-inline:16px}

header{background:var(--card);border-bottom:2px solid var(--red);padding-block:15px 13px;text-align:center}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--red);margin:0 0 3px}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;color:var(--navy)}
.sub{font-size:12px;color:var(--ink-dim);margin:3px 0 0}
.sub:empty{display:none}
.back{background:none;border:0;font-family:inherit;font-size:13.5px;font-weight:600;
  color:var(--navy);padding:0;margin-bottom:8px;cursor:pointer}

section{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);
  margin-top:13px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--navy-soft);
  cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit}
.sec-n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy);background:var(--card);
  border:1px solid var(--line);border-radius:5px;min-width:22px;height:22px;display:grid;place-items:center;flex:none}
.sec-t{font-size:15px;font-weight:600;color:var(--navy);flex:1}
.chev{color:var(--ink-dim);font-size:13px;transition:transform .18s}
.sec-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.sec-b{padding:14px}

.f{margin-bottom:13px}.f:last-child{margin-bottom:0}
label,.lab{display:block;font-size:12.5px;font-weight:600;color:var(--ink-mid);margin-bottom:5px}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=date],textarea,select{width:100%;font-family:inherit;font-size:16px;
  color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;appearance:none}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
textarea{resize:vertical;min-height:58px;line-height:1.45}
.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}

/* field with yesterday's value beside it */
.pair{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:stretch}
.prev{background:var(--lbl);border:1px dashed var(--rule);border-radius:8px;padding:6px 8px;
  display:flex;flex-direction:column;justify-content:center;min-width:0}
.prev-l{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-dim)}
.prev-v{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--navy);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev.none .prev-v{color:var(--ink-dim);font-weight:400}
.up{color:var(--red)}.down{color:var(--green)}.same{color:var(--ink-mid)}

.yn{display:flex;gap:8px}
.yn button{flex:1;font-family:inherit;font-size:15px;font-weight:600;padding:11px 8px;border-radius:8px;
  cursor:pointer;background:var(--sunk);border:1.5px solid var(--line);color:var(--ink-mid)}
.yn button[aria-pressed="true"][data-v="no"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.yn button[aria-pressed="true"][data-v="yes"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.reveal{margin-top:9px}.reveal[hidden]{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:inherit;font-size:14px;font-weight:500;padding:8px 12px;border-radius:99px;
  cursor:pointer;background:var(--sunk);border:1.5px solid var(--line);color:var(--ink-mid)}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

.calc{background:var(--green-soft);border:1px solid var(--green);border-radius:8px;padding:10px 12px;margin-top:9px}
.calc-l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.calc-v{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink);line-height:1.3}
.calc-n{font-size:11.5px;color:var(--ink-mid)}

.med{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px}
.med.stopped{opacity:.55}
.med-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.med-n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-dim);flex:none}
.med-top input{flex:1;background:var(--card)}
.med input{background:var(--card)}
.del{flex:none;width:31px;height:31px;border-radius:7px;cursor:pointer;background:var(--card);
  border:1px solid var(--line);color:var(--red);font-size:16px;line-height:1;font-family:inherit}
.med-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.med-grid .full{grid-column:1/-1}
.med-grid input{font-size:15px;padding:8px 10px}
.mini{font-size:11px;font-weight:600;color:var(--ink-dim);margin-bottom:3px;display:block}
.tagrow{display:flex;gap:6px;margin-top:8px}
.tagrow button{flex:1;font-family:inherit;font-size:12px;font-weight:600;padding:7px 4px;border-radius:7px;
  cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--ink-dim)}
.tagrow button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.addbtn{width:100%;font-family:inherit;font-size:15px;font-weight:600;padding:11px;border-radius:8px;
  cursor:pointer;background:var(--navy-soft);border:1.5px dashed var(--navy);color:var(--navy)}

.checks{margin-top:13px}
.chk{display:flex;gap:9px;padding:10px 12px;border-radius:8px;margin-bottom:6px;font-size:13.5px;
  line-height:1.45;background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink)}
.chk.ok{background:var(--green-soft);border-color:var(--green)}
.chk-i{flex:none;font-weight:700;color:var(--amber)}
.chk.ok .chk-i{color:var(--green)}

/* sign in / lock */
.gate{max-width:360px;margin:34px auto 0;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:22px 20px}
.gate h2{font-size:18px;margin:0 0 4px;color:var(--navy)}
.gate p.g-sub{font-size:13px;color:var(--ink-mid);margin:0 0 16px;line-height:1.45}
.gate .f{margin-bottom:14px}
.gate input{width:100%}
.gate .big-btn{width:100%;font-family:inherit;font-size:15px;font-weight:600;padding:13px;
  border-radius:9px;cursor:pointer;background:var(--navy);border:1.5px solid var(--navy);color:#fff;margin-top:4px}
.gate .warn{font-size:11.5px;color:var(--ink-dim);margin-top:13px;line-height:1.45}
.who{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.who-av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;
  place-items:center;font-weight:700;font-size:14px;flex:none}
.err{color:var(--red);font-size:13px;font-weight:600;margin-top:9px}

/* patient list */
.plist{margin-top:14px}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  margin-bottom:9px;cursor:pointer}
.pid{font-family:var(--mono);font-size:12.5px;font-weight:600;color:#fff;background:var(--navy);
  border-radius:6px;padding:5px 8px;flex:none}
.pmain{flex:1;min-width:0}
.pname{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.pmeta{display:block;font-size:12px;color:var(--ink-dim)}
.pday{font-family:var(--mono);font-size:12px;color:var(--ink-mid);flex:none;text-align:right}
.pcard.closed{opacity:.62;background:var(--sunk)}
.pcard.closed .pid{background:var(--ink-dim)}
.lhead{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-dim);margin:16px 0 8px}
.lhead:first-child{margin-top:4px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  border-bottom:1px solid var(--line-soft);font-size:14px}
.setrow:last-child{border-bottom:0}
.setrow b{color:var(--navy)}
.linkbtn{background:none;border:0;font-family:inherit;font-size:14px;font-weight:600;
  color:var(--navy);cursor:pointer;padding:0}
.linkbtn.danger{color:var(--red)}
.empty{text-align:center;color:var(--ink-dim);font-size:14px;padding:26px 10px}

/* trend */
.trend{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:13px}
table.tr{border-collapse:collapse;width:100%;font-size:13px}
table.tr th,table.tr td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
table.tr th{background:var(--lbl);color:var(--navy);font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase}
table.tr td.k{font-weight:600;color:var(--ink-mid);position:sticky;left:0;background:var(--card)}
table.tr td{font-family:var(--mono)}
table.tr td.k{font-family:var(--sans)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:580px;margin:0 auto;display:flex;gap:7px}
.bar button{flex:1;font-family:inherit;font-size:14px;font-weight:600;padding:12px 4px;border-radius:9px;
  cursor:pointer;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink-mid)}
.bar button.primary{background:var(--navy);border-color:var(--navy);color:#fff}

#preview[hidden]{display:none!important}
#preview{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
#preview .wrap{padding-inline:0}
pre#out{font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:98px;z-index:80;background:var(--navy);
  color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:99px}
.toast[hidden]{display:none!important}
.hint{font-size:11.5px;color:var(--ink-dim);margin:6px 0 0;line-height:1.4}


/* shared records */
.sync{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--ink-dim);margin:10px 0 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--amber)}
.banner{background:var(--amber-soft);border:1px solid var(--amber);color:var(--ink);border-radius:8px;
  padding:9px 12px;font-size:13px;margin-top:12px;line-height:1.45}
.pcard{align-items:flex-start}
.plast{display:flex;align-items:center;flex-wrap:wrap;gap:0 3px;font-size:11.5px;color:var(--navy);margin-top:3px;font-weight:500}
.plast b{font-weight:700}
.av{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--navy);
  color:#fff;font-size:9px;font-weight:700;flex:none;margin-right:4px}
.av.t{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);margin-top:13px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;background:var(--navy-soft)}
.card-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.card-b{padding:12px 14px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-mid);font-weight:600;font-size:12.5px;padding-top:1px}
.kv dd{margin:0;color:var(--ink)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:4px}
.hero-top{display:flex;align-items:center;gap:10px}
.hero-n{font-size:19px;font-weight:700;color:var(--navy);flex:1}
.hero-m{font-size:13px;color:var(--ink-mid);margin-top:4px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:3px 9px}
.pill.open{background:var(--green-soft);color:var(--green)}
.pill.closed{background:var(--sunk);color:var(--ink-mid)}
table.now{border-collapse:collapse;width:100%;font-size:13.5px}
table.now td{padding:6px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.now tr:last-child td{border-bottom:0}
table.now td.v{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap;padding-left:8px}
table.now td.d{font-size:11px;color:var(--ink-dim);text-align:right;white-space:nowrap;padding-left:10px;width:64px}
.mlist{margin:0;padding:0;list-style:none}
.mlist li{padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px;display:flex;gap:8px;align-items:baseline}
.mlist li:last-child{border-bottom:0}
.mlist .mn{font-weight:600;flex:1}
.mlist .md{font-family:var(--mono);font-size:12px;color:var(--ink-mid);text-align:right}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;flex:none}
.tag.started{background:var(--green-soft);color:var(--green)}
.tag.changed{background:var(--amber-soft);color:var(--amber)}
.tag.stopped{background:var(--red-soft);color:var(--red)}
.tl{position:relative;margin-top:4px}
.tli{position:relative;padding:0 0 14px 22px}
.tli:before{content:"";position:absolute;left:6px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.tli:last-child:before{display:none}
.tli:after{content:"";position:absolute;left:1px;top:4px;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--navy)}
.tli.base:after{background:var(--red);border-color:var(--red)}
.tl-h{font-size:14px;font-weight:700;color:var(--ink)}
.tl-m{font-size:12px;color:var(--ink-dim);margin:2px 0 5px;display:flex;align-items:center;gap:2px}
.tl-b{font-size:13px;line-height:1.55;color:var(--ink)}
.tl-b .lc{font-family:var(--mono);font-size:12.5px}
.tl-note{font-size:12.5px;color:var(--ink-mid);background:var(--sunk);border-radius:7px;padding:7px 9px;margin-top:6px}
.tl-act{display:flex;gap:14px;margin-top:6px}
.loading{text-align:center;color:var(--ink-dim);font-size:14px;padding:30px 10px}


/* fast entry */
.choice{display:block;width:100%;text-align:left;font-family:inherit;background:var(--card);border:1.5px solid var(--line);
  border-radius:12px;padding:16px;margin-top:12px;cursor:pointer}
.choice.hl{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
.choice b{display:block;font-size:16px;color:var(--navy);margin-bottom:3px}
.choice span{font-size:13px;color:var(--ink-mid);line-height:1.45}
.pastebtn{width:100%;margin-top:10px;font-family:inherit;font-size:14px;font-weight:600;padding:11px;border-radius:9px;cursor:pointer;
  background:var(--card);border:1.5px solid var(--navy);color:var(--navy)}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim);margin:12px 0 5px}
.grp:first-child{margin-top:0}
.lrow{display:grid;grid-template-columns:112px 1fr 92px;gap:8px;align-items:center;margin-bottom:5px}
.lab-l{font-size:13px;font-weight:600;color:var(--ink-mid);margin:0}
.lrow input{padding:7px 9px;font-family:var(--mono);font-size:16px}
.lab-p{font-family:var(--mono);font-size:12px;color:var(--ink-mid);text-align:right;line-height:1.2}
.lab-p i{display:block;font-style:normal;font-family:var(--sans);font-size:10px;color:var(--ink-dim)}
.sugg{background:var(--card);border:1px solid var(--navy);border-radius:8px;margin:-2px 0 8px;overflow:hidden}
.sugg[hidden]{display:none}
.sugg button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font-family:inherit;font-size:14px;
  background:none;border:0;border-bottom:1px solid var(--line-soft);padding:10px 11px;cursor:pointer;color:var(--ink)}
.sugg button:last-child{border-bottom:0}
.sugg em{font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--green);background:var(--green-soft);border-radius:4px;padding:1px 4px}
.sugg i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink-mid);white-space:nowrap}
.mchips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mchips button{font-family:inherit;font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:99px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--ink-mid)}
.mchips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mcur{font-size:12px;color:var(--ink-mid);font-family:var(--mono);padding-left:4px}
.med.flag{background:var(--amber-soft);border-color:var(--amber)}
.mflag{font-size:12.5px;color:var(--amber);font-weight:600;margin:0 0 8px}

/* ═══ PRINT — identical to the paper record ═══ */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm 10mm}
  body{background:#fff;padding:0}
  body>header,body>.wrap,body>.bar,#preview,.toast{display:none!important}
  #print{display:block;font-family:"IBM Plex Sans",Calibri,system-ui,sans-serif;color:#000;font-size:8.6pt}
  #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .p-head{border-bottom:2.2pt solid #B3121B;padding-bottom:5pt;margin-bottom:9pt}
  .p-eyebrow{font-size:7pt;font-weight:700;letter-spacing:.09em;color:#B3121B;margin-bottom:2pt}
  .p-title{font-size:15pt;font-weight:700;color:#1F3864;letter-spacing:-.01em}
  .p-sub{font-size:7.4pt;color:#5A6478;margin-top:2pt}
  .p-bar{background:#1F3864;color:#fff;font-size:8.4pt;font-weight:700;letter-spacing:.05em;
    padding:4pt 7pt;margin:9pt 0 4pt}
  .p-bar.red{background:#B3121B}
  table.p{border-collapse:collapse;width:100%;table-layout:fixed}
  table.p th,table.p td{border:.5pt solid #AFB6C6;padding:3.4pt 5pt;vertical-align:top;
    word-wrap:break-word;overflow-wrap:break-word}
  table.p th{background:#EDF0F6;color:#1F3864;font-size:6.8pt;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;text-align:left}
  table.p td.k{background:#EDF0F6;font-weight:600;color:#1F3864;font-size:7.4pt;width:26%}
  .p-note{font-size:7.4pt;color:#5A6478;margin-top:3pt;font-style:italic}
  .p-foot{border-top:.6pt solid #AFB6C6;margin-top:11pt;padding-top:6pt;font-size:7.4pt;color:#5A6478;
    display:flex;justify-content:space-between}
  .p-up{color:#B3121B;font-weight:700}
  .p-dn{color:#1E6B3A;font-weight:700}
  tr,table.p{page-break-inside:auto}
  td,th{page-break-inside:avoid}
}

<body>

<header><div class="wrap">
  <p class="eyebrow">Department of Pharmacy · Intensive Care Service</p>
  <h1>Critical Care Pharmacotherapy Review</h1>
  <p class="sub" id="hsub"></p>
</div></header>

<div class="wrap" id="app"></div>

<div class="bar"><div class="bar-in" id="bar"></div></div>

<div id="preview" hidden><div class="wrap">
  <h1 style="font-size:19px;margin-bottom:10px">Send or copy</h1>
  <pre id="out"></pre>
  <div class="bar"><div class="bar-in">
    <button onclick="closePreview()">Back</button>
    <button onclick="copyOut()">Copy</button>
    <button class="primary" onclick="waOut()">WhatsApp</button>
  </div></div>
</div></div>

<div class="toast" id="toast" hidden></div>
<div id="print"></div>

<script>
'use strict';
/* ── the shared record lives in one Google Sheet; this address reaches it ── */
const API='https://script.google.com/macros/s/AKfycbyoMbpdG5RKqq1iHqWJz_0SQ1Bffs2VyEAvKYEzDR1A2f-2LbMzhk-I2ll6aMHwSslZ/exec';
const KEY='ccpr-shared-v1';

/* the lab chart, in the order of the paper "Daily ICU Lab Monitoring Chart" — [group, path, label, codes read from a pasted block] */
const LABCHART=[
 ['Blood count','labs.hct','HCT',['HCT','PCV']],
 ['Blood count','labs.haemoglobin','HGB',['HGB','HB','HAEMOGLOBIN','HEMOGLOBIN']],
 ['Blood count','labs.whitecells','WBC',['WBC','WCC']],
 ['Blood count','labs.platelets','Platelet',['PLT','PLATELET','PLATELETS']],
 ['Blood count','labs.neut','Neutrophil %',['NEUT','NEUTROPHIL','NEUTROPHILS']],
 ['Blood count','labs.lymph','Lymphocytes %',['LYMPH','LYMPHOCYTES']],
 ['Blood count','labs.mono','Monocytes %',['MONO','MONOCYTES']],
 ['Blood count','labs.eos','Eosinophil %',['EOS','EOSINOPHIL']],
 ['Blood count','labs.baso','Basophil %',['BASO','BASOPHIL']],
 ['Chemistry','labs.sodium','S. Na',['NA','SODIUM']],
 ['Chemistry','labs.potassium','S. K',['K','POTASSIUM']],
 ['Chemistry','labs.chloride','S. Cl',['CL','CHLORIDE']],
 ['Chemistry','labs.calcium','S. Ca',['CA','CALCIUM']],
 ['Chemistry','labs.phosphate','S. Phosphorus',['PHOS','PO4','PHOSPHATE','PHOSPHORUS']],
 ['Chemistry','labs.glucose','R.B.S.',['RBS','GLU','GLUCOSE','BS']],
 ['Chemistry','kid.urea','B. Urea',['UREA','BUN','BU']],
 ['Chemistry','kid.creatinine','S. Creatinine',['CREAT','CR','CREATININE','SCR']],
 ['Liver','liv.bilirubin','T.S.B.',['TSB','TBIL','BILI','BILIRUBIN']],
 ['Liver','liv.dbili','D. Bili',['DBIL','DBILI']],
 ['Liver','liv.ibili','ID. Bili',['IBIL','IDBIL','IBILI']],
 ['Liver','liv.ast','S. GOT (AST)',['AST','GOT','SGOT']],
 ['Liver','liv.alt','S. GPT (ALT)',['ALT','GPT','SGPT']],
 ['Liver','liv.alp','ALP',['ALP']],
 ['Liver','liv.protein','T. S. Protein',['TP','PROTEIN','TSP']],
 ['Liver','liv.albumin','S. Albumin',['ALB','ALBUMIN']],
 ['Clotting','liv.pt','PT',['PT']],
 ['Clotting','liv.ptt','PTT',['PTT','APTT']],
 ['Clotting','liv.inr','INR',['INR']],
 ['Inflammation and heart','labs.procalcitonin','PCT',['PCT','PROCALCITONIN']],
 ['Inflammation and heart','labs.crp','CRP',['CRP']],
 ['Inflammation and heart','labs.ddimer','D. Dimer',['DDIMER','D-DIMER','DIMER']],
 ['Inflammation and heart','labs.troponin','Troponin',['TROP','TROPONIN','TNI','TNT']],
 ['Inflammation and heart','labs.bnp','Pro BNP',['BNP','PROBNP','NTPROBNP']],
 ['Thyroid','labs.tsh','TSH',['TSH']],
 ['Thyroid','labs.t3','T3',['T3']],
 ['Thyroid','labs.t4','T4',['T4']],
 ['Also — not on the paper chart','labs.magnesium','Magnesium',['MG','MAGNESIUM']],
 ['Also — not on the paper chart','labs.ionised','Ionised calcium',['ICA','IONISED','IONIZED']],
 ['Also — not on the paper chart','labs.lactate','Lactate',['LACT','LACTATE']],
 ['Also — not on the paper chart','kid.urine','Urine output mL/kg/h',['UO','URINE']],
];
const LABCODE={};LABCHART.forEach(r=>r[3].forEach(c=>LABCODE[c]=r[1]));
const ALLKEYS=LABCHART.map(r=>{const q=r[1].split('.');return [q[0],q[1],r[2]];});
const LABGROUPS=[...new Set(LABCHART.map(r=>r[0]))];

/* S is what this phone keeps: who is signed in, the last copy of the shared list, and unsaved drafts. */
let S={auth:null,lastUser:'',patients:[],fetchedAt:'',drafts:{},profDraft:null,view:'list',current:null};
let UNLOCKED=false, ONLINE=true, BUSY=false, PRINT_ENTRY=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ── talking to the shared record ── */
async function api(action,payload){
  const body=JSON.stringify(Object.assign({action:action,token:S.auth&&S.auth.token},payload||{}));
  let j;
  try{
    const r=await fetch(API,{method:'POST',body:body,headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'});
    j=await r.json(); ONLINE=true;
  }catch(e){ ONLINE=false; return {ok:false,error:'offline',message:'No connection to the shared record.'}; }
  if(!j.ok&&j.error==='auth'&&action!=='login'){UNLOCKED=false;render();toast('Session ended — sign in again');}
  return j;
}
async function refresh(quiet){
  if(BUSY)return;
  const j=await api('list');
  if(j.ok){S.patients=j.data||[];S.fetchedAt=new Date().toISOString();save();}
  else if(!quiet&&j.error!=='auth')toast(j.message||'Could not refresh');
  if(!['form','profedit'].includes(S.view))render();
}

/* ── helpers ── */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;
  clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200);}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jsq=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const normU=u=>String(u||'').trim().toLowerCase().replace(/\s+/g,' ');
const pad=n=>String(n).padStart(2,'0');
function isoToday(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtIso(iso){if(!iso)return '';const d=new Date(iso+'T12:00:00');
  return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function shortIso(iso){if(!iso)return '';const d=new Date(iso+'T12:00:00');
  return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function relTime(ts){
  if(!ts)return '';const d=new Date(ts);if(isNaN(d))return '';
  const s=(Date.now()-d)/1000, hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';
  const t=new Date();const y=new Date(t);y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return 'today '+hm;
  if(d.toDateString()===y.toDateString())return 'yesterday '+hm;
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+hm;}
function initialsOf(name){return normU(name).split(' ').filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function av(name){return '<span class="av'+(/^teba/i.test(name||'')?' t':'')+'">'+esc(initialsOf(name))+'</span>';}
const me=()=>S.auth?S.auth.user:'';
const clone=o=>JSON.parse(JSON.stringify(o));
const P=id=>S.patients.find(p=>p.case_id===id);
const CP=()=>P(S.current);
function entries(p){return (p&&p.entries||[]).slice().sort((a,b)=>
  String(a.date_iso||'').localeCompare(String(b.date_iso||''))||String(a.saved_at||'').localeCompare(String(b.saved_at||'')));}
function lastEntry(p){const e=entries(p);return e.length?e[e.length-1]:null;}
function getPath(o,path){return path.split('.').reduce((x,k)=>x?x[k]:undefined,o);}
const has=v=>!(v===''||v==null);

/* last known value of a finding, from saved entries before a point in time */
function lastKnown(p,path,beforeIso,skipId){
  const list=entries(p).filter(e=>e.entry_id!==skipId&&(!beforeIso||String(e.date_iso)<=beforeIso));
  for(let i=list.length-1;i>=0;i--){const v=getPath(list[i],path);if(has(v))return {v:v,date:list[i].date_iso,by:list[i].pharmacist};}
  return null;}
function lastMedsEntry(p,skipId){const list=entries(p).filter(e=>e.entry_id!==skipId);
  for(let i=list.length-1;i>=0;i--)if(list[i].meds&&list[i].meds.length)return list[i];return null;}
function icuDayFor(p,iso,skipId){
  const list=entries(p).filter(e=>e.entry_id!==skipId&&has(e.icuDay)&&String(e.date_iso)<=iso);
  if(!list.length)return '';const l=list[list.length-1];const n=Number(l.icuDay)+dayDiff(l.date_iso,iso);
  return isNaN(n)?'':String(n);}
function ibwOf(p){const h=parseFloat(p&&p.height),s=p&&p.sex;if(!h||!s)return null;
  const v=(s==='Male'?50:45.5)+0.9*(h-152);return v>0?v:null;}
function arrow(now,then){const a=parseFloat(now),b=parseFloat(then);
  if(isNaN(a)||isNaN(b))return '';if(a>b)return '<span class="up">▲</span>';
  if(a<b)return '<span class="down">▼</span>';return '<span class="same">–</span>';}

/* ── sign in ── */
function signInView(pref){
  return '<div class="gate">'+
  '<div class="f"><label>Username</label><input type="text" id="si-user" autocapitalize="words" '+
  'autocomplete="username" value="'+esc(pref||'')+'"></div>'+
  '<div class="f"><label>Password</label><input type="password" id="si-pass" autocomplete="current-password" '+
  'onkeydown="if(event.key===\'Enter\')doSignIn()"></div>'+
  '<div id="si-err"></div>'+
  '<button class="big-btn" id="si-btn" onclick="doSignIn()">Sign in</button>'+
  '<p class="warn">Both pharmacists see the same patient files. Every update carries the name of the pharmacist who saved it.</p>'+
  '</div>';}
function lockView(){
  const u=S.lastUser;
  return '<div class="gate">'+
  '<div class="who"><span class="who-av">'+esc(initialsOf(u))+'</span>'+
  '<span><b>'+esc(u)+'</b><br><span style="font-size:12px;color:var(--ink-dim)">Department of Pharmacy</span></span></div>'+
  '<div class="f"><label>Password</label><input type="password" id="si-pass" '+
  'autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doSignIn(true)"></div>'+
  '<div id="si-err"></div>'+
  '<button class="big-btn" id="si-btn" onclick="doSignIn(true)">Unlock</button>'+
  '<p class="warn">Not '+esc(u.split(' ')[0])+'? <button class="linkbtn" onclick="signOut()">Sign in as someone else</button></p>'+
  '</div>';}
async function doSignIn(isUnlock){
  const u=isUnlock?S.lastUser:document.getElementById('si-user').value;
  const p=document.getElementById('si-pass').value;
  const e=document.getElementById('si-err'),b=document.getElementById('si-btn');
  if(!u||!p){e.innerHTML='<p class="err">Both are needed.</p>';return;}
  b.disabled=true;b.textContent='Checking…';
  const j=await api('login',{user:u,pass:p});
  b.disabled=false;b.textContent=isUnlock?'Unlock':'Sign in';
  if(!j.ok){e.innerHTML='<p class="err">'+esc(j.error==='offline'?'No connection — check the internet and try again.':(j.message||'Could not sign in.'))+'</p>';return;}
  S.auth={token:j.token,user:j.user,initials:j.initials,expires:j.expires};S.lastUser=j.user;
  UNLOCKED=true;if(!['profile','trend'].includes(S.view)||!CP())S.view='list';save();
  render();toast('Signed in as '+j.user);refresh(true);}
function signOut(){S.auth=null;S.lastUser='';UNLOCKED=false;S.view='list';save();render();window.scrollTo(0,0);}
function lockNow(){UNLOCKED=false;S.view='list';save();render();window.scrollTo(0,0);}

/* ── patient list: everyone's patients ── */
function syncLine(){
  return '<p class="sync"><span class="dot'+(ONLINE?'':' off')+'"></span>'+
    (ONLINE?'Shared record · refreshed '+esc(relTime(S.fetchedAt)||'—'):'Offline · showing the copy from '+esc(relTime(S.fetchedAt)||'—'))+
    ' · <button class="linkbtn" style="font-size:11.5px" onclick="refresh()">Refresh</button></p>';}
function listView(){
  const ps=S.patients.slice().sort((a,b)=>String(a.case_id).localeCompare(String(b.case_id)));
  if(!S.fetchedAt)return '<div class="loading">Loading the shared record…</div>';
  let h=syncLine();
  if(!ONLINE)h+='<div class="banner">No connection. You can read the last copy; saving waits until you are back online.</div>';
  if(!ps.length)return h+'<div class="empty">No patients yet.<br>Tap <b>New patient</b> to start.</div>';
  const open=ps.filter(p=>p.status!=='closed'),shut=ps.filter(p=>p.status==='closed');
  const card=p=>{const isC=p.status==='closed';const l=lastEntry(p);const n=(p.entries||[]).length;
    const day=l?icuDayFor(p,l.date_iso):'';
    return '<button class="pcard'+(isC?' closed':'')+'" onclick="openP(\''+jsq(p.case_id)+'\')">'+
      '<span class="pid">'+esc(String(p.case_id).replace(/^ICU-/,''))+'</span>'+
      '<span class="pmain"><span class="pname">'+esc(p.initials||'no initials')+
        '<span style="font-weight:400;color:var(--ink-mid)"> · '+esc([p.age,p.sex].filter(Boolean).join(' '))+'</span></span>'+
      '<span class="pmeta">'+esc(p.admission_event||p.reason||'not filled in')+'</span>'+
      (p.updated_by?'<span class="plast">'+av(p.updated_by)+'Last update <b>'+esc(p.updated_by)+'</b> · '+esc(relTime(p.updated_at))+'</span>':'')+
      '</span>'+
      '<span class="pday">'+(isC?'closed<br>'+esc(fmtIso(p.closed_on)):(day?'day '+esc(day):'—')+'<br>'+n+' entr'+(n===1?'y':'ies'))+'</span></button>';};
  h+='<div class="plist"><div class="lhead">In the unit — '+open.length+'</div>';
  h+=open.length?open.map(card).join(''):'<div class="empty">No open patients.</div>';
  if(shut.length)h+='<div class="lhead">Closed — '+shut.length+'</div>'+shut.map(card).join('');
  return h+'</div>';}

/* ── patient profile: admission baseline, where things stand now, and every update ── */
function profileView(){
  const p=CP();if(!p)return '<div class="empty">This patient is no longer in the list.</div>';
  const E=entries(p),L=E[E.length-1];const iv=ibwOf(p);
  let h='<button class="back" onclick="go(\'list\')">‹ All patients</button>';
  h+='<div class="hero"><div class="hero-top"><span class="pid">'+esc(p.case_id)+'</span>'+
    '<span class="hero-n">'+esc(p.initials||'—')+'</span><span class="pill '+(p.status==='closed'?'closed':'open')+'">'+
    (p.status==='closed'?'closed':'in the unit')+'</span></div>'+
    '<div class="hero-m">'+esc([p.age&&p.age+' y',p.sex,L&&icuDayFor(p,L.date_iso)&&'ICU day '+icuDayFor(p,L.date_iso)].filter(Boolean).join(' · '))+'</div>'+
    (p.updated_by?'<div class="plast" style="margin-top:6px">'+av(p.updated_by)+'Last update <b>'+esc(p.updated_by)+'</b> · '+esc(relTime(p.updated_at))+'</div>':'')+
    (p.status==='closed'?'<div class="hero-m">Closed '+esc(fmtIso(p.closed_on))+(p.outcome?' · '+esc(p.outcome):'')+'</div>':'')+
    '</div>';

  /* where things stand now */
  const rows=[];
  ALLKEYS.forEach(k=>{const cur=lastKnown(p,k[0]+'.'+k[1]);if(!cur)return;
    const before=entries(p).filter(e=>String(e.date_iso)<String(cur.date));let pv=null;
    for(let i=before.length-1;i>=0;i--){const v=getPath(before[i],k[0]+'.'+k[1]);if(has(v)){pv=v;break;}}
    rows.push('<tr><td>'+esc(k[2])+'</td><td class="v">'+esc(cur.v)+' '+(pv!=null?arrow(cur.v,pv):'')+'</td><td class="d">'+esc(shortIso(cur.date))+'</td></tr>');});
  const w=lastKnown(p,'weight');
  if(w)rows.unshift('<tr><td>Weight (kg)</td><td class="v">'+esc(w.v)+'</td><td class="d">'+esc(shortIso(w.date))+'</td></tr>');
  h+='<div class="card"><div class="card-h"><span class="card-t">Now — latest findings</span></div><div class="card-b">'+
    (rows.length?'<table class="now">'+rows.join('')+'</table>':'<div class="hint">No results recorded yet.</div>')+'</div></div>';

  const mE=lastMedsEntry(p);
  h+='<div class="card"><div class="card-h"><span class="card-t">Medicines on the chart</span>'+
    (mE?'<span class="hint" style="margin:0">'+esc(shortIso(mE.date_iso))+' · '+esc(mE.pharmacist)+'</span>':'')+'</div><div class="card-b">';
  if(mE){const on=mE.meds.filter(m=>m.state!=='stopped'),off=mE.meds.filter(m=>m.state==='stopped');
    h+='<ul class="mlist">'+on.map(m=>'<li><span class="mn">'+esc(m.name)+'</span>'+
      (m.state?'<span class="tag '+m.state+'">'+m.state+'</span>':'')+
      '<span class="md">'+esc([m.dose,m.route,m.freq].filter(Boolean).join(' · '))+'</span></li>').join('')+
      off.map(m=>'<li style="opacity:.6"><span class="mn"><s>'+esc(m.name)+'</s></span><span class="tag stopped">stopped</span></li>').join('')+'</ul>';}
  else h+='<div class="hint">No medicine list recorded yet.</div>';
  h+='</div></div>';

  /* admission profile */
  h+='<div class="card"><div class="card-h"><span class="card-t">Admission profile</span>'+
    '<button class="linkbtn" style="font-size:13px" onclick="editProfile()">Edit</button></div><div class="card-b"><dl class="kv">'+
    kv('Admitted',p.admitted)+kv('What brought them in',p.admission_event)+kv('Operations',p.operations)+
    kv('Main problem',p.reason)+kv('Other problems',p.other)+
    kv('Height',p.height?p.height+' cm':'')+kv('Ideal weight',iv?iv.toFixed(1)+' kg':'')+
    kv('Drug allergy',[p.allergy_drug,p.allergy_drug_what].filter(Boolean).join(' — '))+
    kv('Food allergy',[p.allergy_food,p.allergy_food_what].filter(Boolean).join(' — '))+
    kv('Opened by',p.created_by?p.created_by+' · '+relTime(p.created_at):'')+
    '</dl></div></div>';

  /* timeline */
  h+='<div class="card"><div class="card-h"><span class="card-t">Updates — '+E.length+'</span></div><div class="card-b"><div class="tl">';
  for(let i=E.length-1;i>=0;i--)h+=tlItem(p,E,i);
  h+='<div class="tli base"><div class="tl-h">Admitted to intensive care</div><div class="tl-m">'+esc(p.admitted||'date not recorded')+
    (p.created_by?' · file opened by '+esc(p.created_by):'')+'</div><div class="tl-b">'+esc(p.admission_event||p.reason||'')+'</div></div>';
  h+='</div></div></div>';
  if(p.status==='closed')h+='<p class="hint" style="text-align:center;margin-top:14px"><button class="linkbtn" onclick="reopenP()">Reopen this case</button></p>';
  else h+='<p class="hint" style="text-align:center;margin-top:14px"><button class="linkbtn danger" onclick="closeP()">Close this case</button></p>';
  return h;}
function kv(k,v){return has(v)?'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>':'';}

function tlItem(p,E,i){
  const e=E[i];const parts=[];
  ALLKEYS.forEach(k=>{const v=getPath(e,k[0]+'.'+k[1]);if(!has(v))return;
    let pv=null;for(let j=i-1;j>=0;j--){const x=getPath(E[j],k[0]+'.'+k[1]);if(has(x)){pv=x;break;}}
    parts.push('<span class="lc">'+esc(k[2])+' '+(pv!=null&&String(pv)!==String(v)?esc(pv)+' → ':'')+'<b>'+esc(v)+'</b> '+(pv!=null?arrow(v,pv):'')+'</span>');});
  if(has(e.weight)){let pw=null;for(let j=i-1;j>=0;j--)if(has(E[j].weight)){pw=E[j].weight;break;}
    if(String(pw)!==String(e.weight))parts.unshift('<span class="lc">Weight '+(pw!=null?esc(pw)+' → ':'')+'<b>'+esc(e.weight)+'</b> kg</span>');}
  const meds=e.meds||[];
  const tagged=s=>meds.filter(m=>m.state===s);
  let mtxt='';
  ['started','changed','stopped'].forEach(s=>{const l=tagged(s);if(l.length)mtxt+='<div><span class="tag '+s+'">'+s+'</span> '+
    l.map(m=>esc(m.name)+(s!=='stopped'&&m.dose?' '+esc(m.dose):'')).join(', ')+'</div>';});
  if(meds.length&&!mtxt)mtxt='<div class="hint" style="margin:2px 0 0">Medicines checked — no changes ('+meds.filter(m=>m.state!=='stopped').length+' on chart).</div>';
  const mine=e.pharmacist===me();
  return '<div class="tli"><div class="tl-h">'+esc(fmtIso(e.date_iso)||e.date)+(icuDayFor(p,e.date_iso)?' · day '+esc(icuDayFor(p,e.date_iso)):'')+'</div>'+
    '<div class="tl-m">'+av(e.pharmacist)+esc(e.pharmacist||'—')+' · saved '+esc(relTime(e.saved_at))+'</div>'+
    '<div class="tl-b">'+(parts.length?parts.join('<br>'):'<span class="hint">No results in this update.</span>')+mtxt+
    (e.unclear?'<div class="tl-note">'+esc(e.unclear)+'</div>':'')+'</div>'+

    '<button class="linkbtn" style="font-size:13px" onclick="shareEntry(\''+jsq(e.entry_id)+'\')">WhatsApp</button>'+

  const d=clone(PD());if(!d.initials){toast('Initials are needed');return;}

  if(isNew){const n=pendingChecks(D());if(n&&!confirm(n+' item'+(n===1?' is':'s are')+' still marked to check. Save anyway?'))return;d.create=true;}
  if(d.case_id&&/^\d+$/.test(d.case_id.trim()))d.case_id='ICU-'+d.case_id.trim().padStart(3,'0');
  BUSY=true;toast('Saving…');const j=await api('savePatient',{patient:d});
  if(!j.ok){BUSY=false;toast(j.error==='offline'?'Not saved — no connection. Your entry is kept.':(j.message||'Not saved'));return;}
  if(isNew&&hasContent(D())){const e=cleanEntry(D());e.case_id=j.case_id;

  BUSY=false;if(isNew)delete S.drafts[NEWKEY];
  S.profDraft=null;S.current=j.case_id;save();await refresh(true);go('profile');

function recentMeds(){const seen={},out=[];
  S.patients.forEach(p=>(p.entries||[]).forEach(e=>(e.meds||[]).forEach(m=>{if(!has(m.name))return;
    const k=[m.name,m.dose,m.route,m.freq].join('|').toLowerCase();if(!seen[k]){seen[k]=1;out.push(m);}})));return out;}
function suggest(q){
  q=String(q||'').trim().toLowerCase();if(q.length<2)return [];
  const hit=s=>{s=String(s||'').toLowerCase();return s.startsWith(q)||(q.length>=3&&s.includes(q));};
  const out=[],keys={};
  const add=(name,dose,route,freq,src)=>{const k=(name+'|'+dose+'|'+route+'|'+freq).toLowerCase();if(keys[k])return;keys[k]=1;
    out.push({name,dose,route,freq,src});};
  recentMeds().filter(m=>hit(m.name)).slice(0,4).forEach(m=>add(m.name,m.dose||'',m.route||'',m.freq||'','recent'));
  DRUGS.forEach(d=>{const b=d[1].find(hit);if(hit(d[0])||b)add(b?d[0]+' ('+b+')':d[0],d[2],d[3],d[4],'list');});
  return out.slice(0,7);}

    (s.src==='recent'?'<em>recent</em> ':'')+esc(s.name)+'</span><i>'+esc([s.dose,s.route,s.freq].filter(Boolean).join(' '))+'</i></button>').join('');

function parseDateIso(s){
  s=String(s||'').trim();let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  m=s.match(/(\d{1,2})\s*([A-Za-z]{3})[a-z]*\.?\s*(\d{4})?/);
  if(m&&MON[m[2].toLowerCase()])return (m[3]||new Date().getFullYear())+'-'+pad(MON[m[2].toLowerCase()])+'-'+pad(m[1]);
  m=s.match(/(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?/);
  if(m){let y=m[3]||String(new Date().getFullYear());if(y.length===2)y='20'+y;return y+'-'+pad(m[2])+'-'+pad(m[1]);}
  return '';}
function labPath(code){
  const raw=String(code||'').toUpperCase();
  const tries=[raw.replace(/[^A-Z0-9-]/g,''),raw.replace(/[^A-Z0-9]/g,'')];
  const par=raw.match(/\(([^)]+)\)/);if(par)tries.unshift(par[1].replace(/[^A-Z0-9]/g,''));
  tries.push(tries[tries.length-1].replace(/^(S|B|SERUM)/,''));
  for(const t of tries)if(LABCODE[t])return LABCODE[t];return null;}
function parseMedLine(line){
  let t=line.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,'').trim();if(!t)return null;
  const parts=t.split('|').map(x=>x.trim());
  const m={name:'',dose:'',route:'',freq:'',started:'',why:'',state:''};const flags=[];
  const take=(v)=>{let x=v;if(/⚠/.test(x)){const note=x.split('⚠')[1].trim();flags.push(note||'check');x=x.split('⚠')[0].trim();}return x;};
  m.name=take(parts[0]||'');
  m.dose=take(parts[1]||'');m.route=take(parts[2]||'');m.freq=take(parts[3]||'');
  parts.slice(4).forEach(x=>{const v=take(x);const l=v.toLowerCase();
    if(['started','changed','stopped'].includes(l))m.state=l;else if(l==='new')m.state='started';else if(l==='stop')m.state='stopped';
    else if(v)m.why=m.why?m.why+'; '+v:v;});
  if(m.dose==='?'){m.dose='';flags.push('dose not written');}
  if(m.freq==='?'){m.freq='';flags.push('frequency not written');}
  m.freq=m.freq.replace(/^x\s*(\d)/i,'×$1');
  if(flags.length)m.flag=flags.filter(Boolean).join('; ');
  return m.name?m:null;}
function parseBlock(text){
  const out={ok:false,profile:{},entry:{},labs:[],meds:[],check:[],unmatched:[],notes:''};
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  if(!lines.some(l=>/#CCPR/i.test(l)))return {ok:false,msg:'This does not look like an ORION block — it should start with #CCPR.'};
  const KEYS=['patient','height','admitted','event','ops','operations','reason','problem','other','allergy','allergies',
    'date','icu_day','day','weight','labs','meds','notes','check'];
  const text_={};let key=null;
  const addLabs=s=>s.split(/[;·|\n]+/).forEach(tok=>{tok=tok.trim();if(!tok)return;
    const m=tok.match(/^(.*?)[\s:=]+([<>]?\d+(?:\.\d+)?)\s*(.*)$/);
    if(!m){out.unmatched.push(tok);return;}
    const path=labPath(m[1]);if(path)out.labs.push([path,m[2].replace(/^[<>]/,'')]);else out.unmatched.push(tok);});
  lines.forEach(raw=>{
    if(!raw.trim()||/#CCPR/i.test(raw))return;
    const indented=/^\s/.test(raw);
    const m=raw.match(/^([A-Za-z_]+)\s*:?\s*(.*)$/);
    const k=m&&m[1].toLowerCase();
    if(!indented&&k&&KEYS.includes(k)&&raw.indexOf('|')<0||(!indented&&k&&KEYS.includes(k)&&k==='patient')){
      key=k;const v=m[2].trim();
      if(k==='labs'){const rest=v.replace(/^\d{4}-\d{2}-\d{2}|^\d{1,2}\s*[A-Za-z]{3}(\s*\d{4})?/,'').trim();
        const dm=v.match(/^(\d{4}-\d{2}-\d{2}|\d{1,2}\s*[A-Za-z]{3}(\s*\d{4})?)/);
        if(dm&&!has(out.entry.date_iso))out.entry.date_iso=parseDateIso(dm[1]);if(rest)addLabs(rest);}
      else if(k==='meds'){if(v&&v.indexOf('|')>=0){const md=parseMedLine(v);if(md)out.meds.push(md);}}
      else text_[k]=v;
      return;}
    if(key==='labs')addLabs(raw);
    else if(key==='meds'){const md=parseMedLine(raw);if(md)out.meds.push(md);}
    else if(key)text_[key]=(text_[key]?text_[key]+' ':'')+raw.trim();
  });
  const P_=out.profile;
  if(text_.patient){const b=text_.patient.split('|').map(x=>x.trim());
    P_.initials=b[0]||'';const age=(b[1]||'').match(/\d+/);P_.age=age?age[0]:'';
    const sx=(b[2]||'').toLowerCase();P_.sex=/^(f|female|♀|انثى|أنثى)/.test(sx)?'Female':/^(m|male|♂|ذكر)/.test(sx)?'Male':'';}
  if(text_.height){const h=text_.height.match(/\d+(\.\d+)?/);P_.height=h?h[0]:'';}
  if(text_.admitted)P_.admitted=text_.admitted;
  if(text_.event)P_.admission_event=text_.event;
  if(text_.ops||text_.operations)P_.operations=text_.ops||text_.operations;
  if(text_.reason||text_.problem)P_.reason=text_.reason||text_.problem;
  if(text_.other)P_.other=text_.other;
  const al=text_.allergy||text_.allergies;
  if(al){if(/unknown|not known|\?/i.test(al))P_.allergy_drug='unknown';
    else if(/^(no|none|nil|nkda|no known)/i.test(al))P_.allergy_drug='no';
    else{P_.allergy_drug='yes';P_.allergy_drug_what=al;}}
  if(text_.date)out.entry.date_iso=parseDateIso(text_.date);
  const dy=text_.icu_day||text_.day;if(dy){const n=dy.match(/\d+/);if(n)out.entry.icuDay=n[0];}
  if(text_.weight){const w=text_.weight.match(/\d+(\.\d+)?/);if(w)out.entry.weight=w[0];}
  if(text_.notes)out.notes=text_.notes;
  if(text_.check)out.check=text_.check.split(/[;·]+/).map(x=>x.trim()).filter(Boolean);
  out.ok=true;return out;}

async function saveEntry(){
  const n=pendingChecks(D());if(n&&!confirm(n+' item'+(n===1?' is':'s are')+' still marked to check. Save anyway?'))return;
  const d=cleanEntry(D());d.case_id=S.current;

  if(!j.ok){toast(j.error==='offline'?'Not saved — no connection. Your update is kept on this phone.':(j.message||'Not saved'));return;}

/* ── live checks while filling ── */
function refreshLive(){
  const box=document.getElementById('ibwbox');
  if(box){const src=S.view==='profedit'?PD():CP();const v=ibwOf(src);
    box.innerHTML='<div class="calc-l">Ideal weight</div><div class="calc-v">'+(v?v.toFixed(1)+' kg':'—')+'</div><div class="calc-n">'+
      (v?esc(src.sex)+' · '+(src.sex==='Male'?'50.0':'45.5')+' + 0.9 × ('+esc(src.height)+' − 152)':'Enter sex and height in the profile')+'</div>';}
  const ch=document.getElementById('checks');if(!ch||!(S.view==='form'||(S.view==='profedit'&&isNewFlow())))return;
  const d=D(),p=CP()||{},out=[];
  const n=k=>{const f=parseFloat(getPath(d,k));return isNaN(f)?null:f;};
  const blank=k=>!has(getPath(d,k));
  if(blank('kid.creatinine')){const lk=lastKnown(p,'kid.creatinine',d.date_iso,d.entry_id);
    out.push('Creatinine is blank'+(lk?' — last known '+lk.v+' on '+shortIso(lk.date)+'.':'. No kidney-dependent dose can be checked without it.'));}
  if(d.creatTrend==='going up')out.push('Creatinine is rising — every clearance figure calculated today will read higher than the truth.');
  if(n('labs.potassium')!==null&&n('labs.potassium')<3.5&&blank('labs.magnesium'))
    out.push('Potassium is low and magnesium is blank. Potassium will not correct through a magnesium shortage.');
  if(n('labs.ionised')!==null&&n('labs.ionised')<1.0&&blank('labs.magnesium'))
    out.push('Ionised calcium is low and magnesium is blank. Calcium will not hold without magnesium.');
  if(d.swollen==='yes')out.push('Swollen — the weight on the scale is not the weight to dose with.');
  if(!(S.view==='profedit'?PD():p).height)out.push('Height is missing from the profile, so ideal weight cannot be worked out.');
  const lk=lastKnown(p,'kid.creatinine',d.date_iso,d.entry_id);
  if(lk&&n('kid.creatinine')!==null){const b=parseFloat(lk.v);
    if(b>0&&Math.abs(n('kid.creatinine')-b)/b>=0.25)out.push('Creatinine has moved more than a quarter since '+shortIso(lk.date)+' — every renal dose needs re-checking.');}
  ch.innerHTML=out.length?out.map(t=>'<div class="chk"><span class="chk-i">!</span><span>'+esc(t)+'</span></div>').join('')
    :'<div class="chk ok"><span class="chk-i">✓</span><span>Nothing flagged on the entries so far.</span></div>';}

/* ── trend: every update side by side ── */
function trendRows(p,E){
  const rows=[];const push=(label,get)=>{const vals=E.map(get);if(vals.some(has))rows.push([label,vals]);};
  push('ICU day',e=>icuDayFor(p,e.date_iso));
  push('Weight (kg)',e=>e.weight);
  LABCHART.forEach(r=>push(r[2],e=>getPath(e,r[1])));
  push('Creatinine trend',e=>e.creatTrend);
  push('Medicines on chart',e=>(e.meds||[]).filter(m=>m.state!=='stopped').length||'');
  push('Pharmacist',e=>initialsOf(e.pharmacist));
  return rows;}
function trendView(){
  const p=CP(),E=entries(p);
  let h='<button class="back" onclick="go(\'profile\')">‹ '+esc(p.case_id)+' profile</button>';
  if(E.length<2)return h+'<div class="empty">One update so far — the trend needs two.</div>';
  h+='<div class="trend"><table class="tr"><thead><tr><th>Finding</th>'+E.map(e=>'<th>'+esc(shortIso(e.date_iso))+'</th>').join('')+'</tr></thead><tbody>';
  trendRows(p,E).forEach(r=>{h+='<tr><td class="k">'+esc(r[0])+'</td>'+
    r[1].map((v,i)=>{let a='';if(i>0&&r[0]!=='Pharmacist'){for(let j=i-1;j>=0;j--)if(has(r[1][j])){a=arrow(v,r[1][j]);break;}}
      return '<td>'+esc(has(v)?v:'—')+' '+(has(v)?a:'')+'</td>';}).join('')+'</tr>';});
  return h+'</tbody></table></div>';}

/* ── WhatsApp text for one update ── */
function entryPair(eid){const p=CP(),E=entries(p);let i=eid?E.findIndex(e=>e.entry_id===eid):E.length-1;
  if(i<0)i=E.length-1;return {p:p,E:E,i:i,d:E[i],prevOf:path=>{for(let j=i-1;j>=0;j--){const v=getPath(E[j],path);if(has(v))return v;}return null;}};}
function build(eid){
  const x=entryPair(eid),c=x.p,d=x.d;const L=[];
  if(!d)return 'No updates yet.';
  L.push('CRITICAL CARE PHARMACOTHERAPY REVIEW');L.push('Department of Pharmacy — Intensive Care Service');L.push('');
  L.push(c.case_id+' · '+(c.initials||'—')+' · '+(c.age||'?')+' '+(c.sex||'')+' · ICU day '+(icuDayFor(c,d.date_iso)||'?'));
  L.push('Pharmacist: '+(d.pharmacist||'—'));
  L.push(fmtIso(d.date_iso)+(x.i>0?'   (update '+(x.i+1)+' of '+x.E.length+')':'   FIRST ENTRY'));L.push('');
  if(x.i===0){
    if(c.admission_event)L.push('WHAT BROUGHT THEM IN: '+c.admission_event);
    if(c.operations)L.push('OPERATIONS: '+c.operations);
    L.push('MAIN PROBLEM: '+(c.reason||'—'));if(c.other)L.push('OTHER PROBLEMS: '+c.other);
    L.push('ALLERGY — drug: '+(c.allergy_drug||'—')+(c.allergy_drug_what?' ('+c.allergy_drug_what+')':'')+
      ' · food: '+(c.allergy_food||'—')+(c.allergy_food_what?' ('+c.allergy_food_what+')':''));L.push('');}
  const line=(lbl,path)=>{const now=getPath(d,path),then=x.prevOf(path);
    if(!has(now))return null;if(then==null)return lbl+': '+now;
    if(String(now)===String(then))return lbl+': '+now+'  (unchanged)';
    const a=parseFloat(now),b=parseFloat(then);
    return lbl+': '+then+' -> '+now+((!isNaN(a)&&!isNaN(b))?(a>b?' UP':' DOWN'):'');};
  const iv=ibwOf(c);
  L.push('WEIGHT '+(d.weight||'—')+' kg'+(d.swollen==='yes'?' (SWOLLEN — not a dosing weight)':'')+
    ' · height '+(c.height||'—')+' cm'+(iv?' · ideal '+iv.toFixed(1)+' kg':''));L.push('');
  const block=(title,list,pre)=>{const out=list.map(k=>line(k[1],pre+'.'+k[0])).filter(Boolean);
    if(out.length){L.push(title);out.forEach(s=>L.push(s));L.push('');}};
  LABGROUPS.forEach(g=>{const out=LABCHART.filter(r=>r[0]===g).map(r=>line(r[2],r[1])).filter(Boolean);
    if(out.length){L.push(g.toUpperCase());out.forEach(x=>L.push(x));L.push('');}});
  if(d.creatTrend)L.push('Creatinine is '+d.creatTrend.toUpperCase());if(d.dialysis)L.push('Dialysis: '+d.dialysis);
  if(d.vent||d.feeding||d.lines){L.push('STATUS');if(d.vent)L.push('Breathing: '+d.vent);if(d.feeding)L.push('Feeding: '+d.feeding);
    if(d.lines)L.push('Lines: '+d.lines);L.push('');}
  const meds=d.meds||[];
  if(meds.length){const st=s=>meds.filter(m=>m.state===s);
    if(x.i>0){L.push('MEDICINE CHANGES');st('started').forEach(m=>L.push('STARTED  '+medTxt(m)));
      st('changed').forEach(m=>L.push('CHANGED  '+medTxt(m)));st('stopped').forEach(m=>L.push('STOPPED  '+(m.name||'—')));
      if(!st('started').length&&!st('changed').length&&!st('stopped').length)L.push('No medicine changes.');
      const nOn=meds.filter(m=>m.state!=='stopped').length;L.push('ON CHART NOW: '+nOn+' medicine'+(nOn===1?'':'s'));}
    else{L.push('MEDICINES — '+meds.length);meds.forEach((m,i)=>L.push((i+1)+'. '+medTxt(m)));}
    L.push('');}
  if(d.cultures)L.push('CULTURES: '+d.cultures);
  if(d.unclear)L.push('NOTES / UNSURE: '+d.unclear);
  L.push('');L.push('Initials only. From the shared ICU pharmacy record.');
  return L.join('\n');}
function medTxt(m){return [m.name,m.dose,m.route,m.freq].filter(Boolean).join('  ')+(m.why?'   — '+m.why:'');}
let OUT_ID=null;
function shareEntry(eid){OUT_ID=eid;document.getElementById('out').textContent=build(eid);
  document.getElementById('preview').hidden=false;window.scrollTo(0,0);}
function closePreview(){document.getElementById('preview').hidden=true;}
function copyOut(){const t=build(OUT_ID);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Could not copy'));
  else toast('Select the text and copy');}
function waOut(){window.open('https://wa.me/?text='+encodeURIComponent(build(OUT_ID)),'_blank');}

/* ── print: identical to the paper record ── */
function printEntry(eid){if(!entries(CP()).length){toast('No updates to print yet');return;}
  buildPrint(eid);setTimeout(()=>window.print(),60);}
function buildPrint(eid){
  const x=entryPair(eid),c=x.p,d=x.d,iv=ibwOf(c);
  const hasPrev=x.i>0;
  const row=(k,v)=>'<tr><td class="k">'+esc(k)+'</td><td class="v" colspan="3">'+esc(v||'')+'</td></tr>';
  const q=(k1,v1,k2,v2)=>'<tr><td class="k">'+esc(k1)+'</td><td class="v">'+esc(v1||'')+
    '</td><td class="k">'+esc(k2)+'</td><td class="v">'+esc(v2||'')+'</td></tr>';
  const pv=path=>{const now=getPath(d,path),then=x.prevOf(path);
    if(then==null)return esc(has(now)?now:'');
    if(!has(now))return '<span style="color:#5A6478">'+esc(then)+' (last)</span>';
    const a=parseFloat(now),b=parseFloat(then);
    const ar=(!isNaN(a)&&!isNaN(b))?(a>b?'<span class="p-up">▲</span>':a<b?'<span class="p-dn">▼</span>':'–'):'';
    return esc(then)+' → <b>'+esc(now)+'</b> '+ar;};
  const prevDate=hasPrev?x.E[x.i-1].date_iso:'';
  let h='<div class="p-head"><div class="p-eyebrow">DEPARTMENT OF PHARMACY  ·  INTENSIVE CARE SERVICE</div>'+
    '<div class="p-title">Critical Care Pharmacotherapy Review</div>'+
    '<div class="p-sub">'+esc(c.case_id)+'  ·  '+esc(c.initials||'—')+'  ·  update '+(x.i+1)+' of '+x.E.length+
    (hasPrev?'  ·  previous update '+esc(fmtIso(prevDate)):'  ·  first entry')+'</div></div>';
  h+='<table class="p"><tr><th>Case no.</th><th>Initials</th><th>Age · sex</th><th>ICU day</th></tr>'+
    '<tr><td class="v">'+esc(c.case_id)+'</td><td class="v">'+esc(c.initials)+'</td><td class="v">'+
    esc([c.age,c.sex].filter(Boolean).join(' · '))+'</td><td class="v">'+esc(icuDayFor(c,d.date_iso))+'</td></tr>'+
    '<tr><th>Admitted on</th><th>This update</th><th>Main problem</th><th>Pharmacist</th></tr>'+
    '<tr><td class="v">'+esc(c.admitted)+'</td><td class="v">'+esc(fmtIso(d.date_iso))+'</td><td class="v">'+
    esc(c.reason)+'</td><td class="v">'+esc(d.pharmacist||'')+'</td></tr></table>';
  h+='<div class="p-bar">1  ·  WEIGHT AND HEIGHT</div><table class="p">'+
    q('Weight (kg)',(d.weight||'')+(d.swollen==='yes'?'  — SWOLLEN':''),'Height (cm)',c.height)+
    row('Ideal weight',iv?iv.toFixed(1)+' kg   ('+(c.sex||'')+' · '+(c.sex==='Male'?'50.0':'45.5')+' + 0.9 × ('+(c.height||'?')+' − 152))':'not calculable')+'</table>';
  h+='<div class="p-bar">2  ·  WHY IN INTENSIVE CARE</div><table class="p">'+
    row('What brought them in',c.admission_event)+row('Operations this admission',c.operations)+
    row('Main problem',c.reason)+row('Other problems',c.other)+'</table>';
  h+='<div class="p-bar">3  ·  ALLERGIES</div><table class="p">'+
    q('Drug allergy',c.allergy_drug,'If yes — what',c.allergy_drug_what)+
    q('Food allergy',c.allergy_food,'If yes — what',c.allergy_food_what)+'</table>';
  const hd='<tr><th>Finding</th><th>'+(hasPrev?'Previous → today':'Today')+'</th><th>Finding</th><th>'+(hasPrev?'Previous → today':'Today')+'</th></tr>';
  const pairs=list=>{let s='';for(let i=0;i<list.length;i+=2){s+='<tr><td class="k">'+esc(list[i][0])+'</td><td class="v">'+list[i][1]+'</td>'+
    (list[i+1]?'<td class="k">'+esc(list[i+1][0])+'</td><td class="v">'+list[i+1][1]+'</td>':'<td></td><td></td>')+'</tr>';}return s;};
  const rowsL=LABCHART.filter(r=>has(getPath(d,r[1]))||x.prevOf(r[1])!=null).map(r=>[r[2],pv(r[1])]);
  h+='<div class="p-bar">4  ·  LAB CHART</div><table class="p">'+hd+(rowsL.length?pairs(rowsL):'<tr><td colspan="4" class="v">No results recorded.</td></tr>')+
    q('Creatinine is',d.creatTrend,'On dialysis',d.dialysis)+q('Fluid in abdomen',d.ascites,'Confusion beyond sedation',d.enceph)+'</table>';
  h+='<div class="p-bar">5  ·  STATUS, FEEDING AND LINES</div><table class="p">'+
    q('Breathing',d.vent,'Feeding',d.feeding)+row('Central line',d.lines)+row('Cultures',d.cultures)+'</table>';
  const meds=d.meds&&d.meds.length?d.meds:((lastMedsEntry(c)||{}).meds||[]);
  h+='<div class="p-bar">6  ·  MEDICINES  —  '+meds.filter(m=>m.state!=='stopped').length+' on chart, '+meds.length+' listed</div>'+
    '<table class="p"><tr><th style="width:5%">#</th><th style="width:27%">Medicine</th><th style="width:14%">Dose</th>'+
    '<th style="width:10%">Route</th><th style="width:14%">How often</th><th style="width:18%">What it is for</th><th style="width:12%">Change</th></tr>';
  meds.forEach((m,i)=>{h+='<tr><td class="v">'+(i+1)+'</td><td class="v">'+esc(m.name)+'</td><td class="v">'+esc(m.dose)+
    '</td><td class="v">'+esc(m.route)+'</td><td class="v">'+esc(m.freq)+'</td><td class="v">'+esc(m.why)+
    '</td><td class="v">'+esc(m.state?m.state.toUpperCase():'')+'</td></tr>';});
  h+='</table>';
  if(d.unclear)h+='<div class="p-bar red">NOTES  ·  COULD NOT READ OR UNSURE</div><table class="p">'+row('Notes',d.unclear)+'</table>';
  const E=x.E.slice(Math.max(0,x.i-6),x.i+1);
  if(E.length>1){h+='<div class="p-bar">DAY BY DAY</div><table class="p"><tr><th>Finding</th>'+
      E.map(e=>'<th>'+esc(shortIso(e.date_iso))+'</th>').join('')+'</tr>';
    trendRows(c,E).forEach(r=>{h+='<tr><td class="k">'+esc(r[0])+'</td>'+r[1].map(v=>'<td class="v">'+esc(has(v)?v:'—')+'</td>').join('')+'</tr>';});
    h+='</table>';}
  h+='<div class="p-foot"><span>Pharmacist '+esc(d.pharmacist||'______________')+'   Signature ______________   Time _________</span>'+
    '<span>Initials only — no full name, no hospital number.</span></div>';
  document.getElementById('print').innerHTML=h;}

/* ── start ── */
load();
if(S.auth&&S.auth.expires&&Date.now()>S.auth.expires)S.auth=null;
render();
setInterval(()=>{if(UNLOCKED&&S.auth&&['list','profile','trend'].includes(S.view)&&!document.hidden)refresh(true);},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&UNLOCKED&&S.auth&&['list','profile','trend'].includes(S.view))refresh(true);});
</script>
